<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TM Chrono Heatmap (Auto)</title>
  <style>
    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #f0b90b;
      margin-bottom: 5px;
    }
    p.subtitle {
      text-align: center;
      color: #848e9c;
      font-size: 14px;
      margin-bottom: 25px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #181a20;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 16px;
      text-align: center;
      border-bottom: 1px solid #2b313a;
    }
    th {
      background-color: #2b313a;
      color: #eaeaea;
      font-size: 14px;
    }
    .badge-up {
      background-color: rgba(14, 203, 129, 0.2);
      color: #0ecb81;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge-down {
      background-color: rgba(246, 70, 93, 0.2);
      color: #f6465d;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>TM CHRONO HEATMAP</h1>
    <p class="subtitle">Data probabilitas otomatis di-update setiap jam 05:30 WIB</p>
    
    <table>
      <thead>
        <tr>
          <th>JAM / MENIT (WIB)</th>
          <th>ARAH (DOMINAN)</th>
          <th>PROBABILITAS (%)</th>
          <th>TOTAL SAMPEL HARI</th>
        </tr>
      </thead>
      <tbody id="heatmap-body">
        <tr>
          <td colspan="4">Memuat data...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    async function loadHeatmap() {
      try {
        const response = await fetch('heatmap_data.json');
        const data = await response.json();
        const tbody = document.getElementById('heatmap-body');
        tbody.innerHTML = '';

        // Urutkan berdasarkan waktu
        const sortedTimes = Object.keys(data).sort();

        sortedTimes.forEach(timeStr => {
          const item = data[timeStr];
          const row = document.createElement('tr');

          const badgeClass = item.direction === 'UP' ? 'badge-up' : 'badge-down';

          row.innerHTML = `
            <td><strong>${timeStr}</strong></td>
            <td><span class="${badgeClass}">${item.direction}</span></td>
            <td><strong>${item.probability}%</strong></td>
            <td>${item.samples} Hari</td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        document.getElementById('heatmap-body').innerHTML = `<tr><td colspan="4" style="color:#f6465d">Gagal memuat file JSON. Pastikan workflow sudah selesai berjalan.</td></tr>`;
      }
    }

    loadHeatmap();
  </script>
</body>
</html>
