<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono Heatmap - Multi Timeframe Seasonality</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            padding: 20px; 
        }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .info-card { 
            background: #1e293b; 
            padding: 15px; 
            border-radius: 8px; 
            text-align: center; 
            margin-bottom: 20px; 
            border: 1px solid #334155; 
        }
        table { 
            width: 100%; 
            max-width: 950px; 
            margin: 0 auto; 
            border-collapse: collapse; 
            background: #1e293b; 
            border-radius: 8px; 
            overflow: hidden; 
        }
        th, td { padding: 10px 12px; text-align: center; border-bottom: 1px solid #334155; }
        th { background-color: #334155; color: #f1f5f9; font-size: 14px; }
        tr:hover { background-color: #334155/50; }

        /* Style dasar badge */
        .badge { 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-size: 13px; 
            font-weight: 600;
            display: inline-block;
        }

        /* 1. 50% - 55.9%: Netral (Abu-abu) */
        .neutral { background-color: #334155; color: #cbd5e1; }

        /* 2. 56% - 60.9%: Terang / Muda */
        .buy-light { background-color: #14532d; color: #86efac; border: 1px solid #22c55e; }
        .sell-light { background-color: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; }

        /* 3. 61% - 65%: Normal */
        .buy-normal { background-color: #166534; color: #ffffff; }
        .sell-normal { background-color: #991b1b; color: #ffffff; }

        /* 4. > 65%: Pekat / Bold (High Conviction) */
        .buy-dark { background-color: #22c55e; color: #052e16; font-weight: 800; box-shadow: 0 0 8px #22c55e88; }
        .sell-dark { background-color: #ef4444; color: #450a0a; font-weight: 800; box-shadow: 0 0 8px #ef444488; }
    </style>
</head>
<body>

    <h1>🔥 Chrono Heatmap (XAUUSD)</h1>
    <p class="subtitle">Win-Rate Simulation (TP 50 Pips / SL 50 Pips - 15m Window)</p>

    <div class="info-card" id="infoCard">Memuat data...</div>

    <table>
        <thead>
            <tr>
                <th>Waktu (WIB)</th>
                <th>1 Bulan (30 Hari)</th>
                <th>2 Bulan (60 Hari)</th>
                <th>Keseluruhan Data</th>
            </tr>
        </thead>
        <tbody id="heatmapBody">
            <tr><td colspan="4">Memuat data probabilitas...</td></tr>
        </tbody>
    </table>

    <script>
        // Fungsi menentukan warna berdasarkan nilai persen & arah BUY/SELL
        function getBadgeClass(direction, prob) {
            if (prob <= 55.9) return 'neutral';

            const dir = String(direction).toUpperCase();
            if (dir === 'BUY' || dir === 'UP') {
                if (prob >= 56.0 && prob <= 60.9) return 'buy-light';
                if (prob >= 61.0 && prob <= 65.0) return 'buy-normal';
                if (prob > 65.0) return 'buy-dark';
            } else if (dir === 'SELL' || dir === 'DOWN') {
                if (prob >= 56.0 && prob <= 60.9) return 'sell-light';
                if (prob >= 61.0 && prob <= 65.0) return 'sell-normal';
                if (prob > 65.0) return 'sell-dark';
            }
            return 'neutral';
        }

        fetch('heatmap_data.json')
            .then(res => res.json())
            .then(data => {
                const meta = data.metadata;
                document.getElementById('infoCard').innerHTML = `
                    <b>Sampel Aktif:</b> 1 Bulan (${meta.days_1m} Hari) | 
                    2 Bulan (${meta.days_2m} Hari) | 
                    <b>Total Semua:</b> ${meta.total_days_all} Hari Sampel
                `;

                const tbody = document.getElementById('heatmapBody');
                tbody.innerHTML = '';

                for (const [timeStr, item] of Object.entries(data.heatmap)) {
                    const row = document.createElement('tr');
                    
                    const formatCell = (d) => {
                        if (!d || d.samples === 0) return '-';
                        const badgeClass = getBadgeClass(d.direction, d.probability);
                        return `
                            <span class="badge ${badgeClass}">${d.direction} ${d.probability}%</span> 
                            <br><small style="color:#64748b; font-size: 11px;">(${d.samples}s)</small>
                        `;
                    };

                    row.innerHTML = `
                        <td><b>${timeStr}</b></td>
                        <td>${formatCell(item.m1)}</td>
                        <td>${formatCell(item.m2)}</td>
                        <td>${formatCell(item.all)}</td>
                    `;
                    tbody.appendChild(row);
                }
            })
            .catch(err => {
                document.getElementById('heatmapBody').innerHTML = `
                    <tr><td colspan="4" style="color:#f87171">Gagal memuat data JSON.</td></tr>
                `;
            });
    </script>
</body>
</html>
