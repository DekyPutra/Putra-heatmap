<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono Heatmap - Multi Timeframe Seasonality</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .info-card { background: #1e293b; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; border: 1px solid #334155; }
        table { width: 100%; max-width: 900px; margin: 0 auto; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: center; border-bottom: 1px solid #334155; }
        th { background-color: #334155; color: #f1f5f9; font-size: 14px; }
        tr:hover { background-color: #334155/50; }
        .up { color: #4ade80; font-weight: bold; }
        .down { color: #f87171; font-weight: bold; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        .badge-up { background: #14532d; color: #86efac; }
        .badge-down { background: #7f1d1d; color: #fca5a5; }
    </style>
</head>
<body>

    <h1>🔥 Chrono Heatmap (XAUUSD)</h1>
    <p class="subtitle">Analisis Probabilitas Intraday Seasonality Multi-Timeframe</p>

    <div class="info-card" id="infoCard">Loading metadata...</div>

    <table>
        <thead>
            <tr>
                <th>Waktu (WIB)</th>
                <th>1 Bulan (30 Hari)</th>
                <th>2 Bulan (60 Hari)</th>
                <th>Keseluruhan Data</th>
            </tr>
        </thead>
        <tbody id="heatmapBody">
            <tr><td colspan="4">Memuat data probabilitas...</td></tr>
        </tbody>
    </table>

    <script>
        fetch('heatmap_data.json')
            .then(res => res.json())
            .then(data => {
                const meta = data.metadata;
                document.getElementById('infoCard').innerHTML = `
                    <b>Sampel Aktif:</b> 1 Bulan (${meta.days_1m} Hari) | 
                    2 Bulan (${meta.days_2m} Hari) | 
                    <b>Total Semua:</b> ${meta.total_days_all} Hari Sampel
                `;

                const tbody = document.getElementById('heatmapBody');
                tbody.innerHTML = '';

                for (const [timeStr, item] of Object.entries(data.heatmap)) {
                    const row = document.createElement('tr');
                    
                    const formatCell = (d) => {
                        if (!d || d.samples === 0) return '-';
                        const cls = d.direction === 'UP' ? 'badge-up' : 'badge-down';
                        return `<span class="badge ${cls}">${d.direction} ${d.probability}%</span> <small style="color:#64748b">(${d.samples}s)</small>`;
                    };

                    row.innerHTML = `
                        <td><b>${timeStr}</b></td>
                        <td>${formatCell(item.m1)}</td>
                        <td>${formatCell(item.m2)}</td>
                        <td>${formatCell(item.all)}</td>
                    `;
                    tbody.appendChild(row);
                }
            })
            .catch(err => {
                document.getElementById('heatmapBody').innerHTML = `<tr><td colspan="4" style="color:#f87171">Gagal memuat data. Pastikan Actions sudah dijalankan.</td></tr>`;
            });
    </script>
</body>
</html>
