name: Daily Chrono Data Update

on:
  schedule:
    # 22:30 UTC = 05:30 WIB (Pagi hari setelah New York Close)
    - cron: '30 22 * * *'
  workflow_dispatch: # Memungkinkan tombol 'Run manually' jika ingin coba eksekusi manual

jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance numpy

      - name: Run Data Pipeline Script
        run: python process_data.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add historical_m1_store.csv heatmap_data.json
          git commit -m "Auto-update Chrono Heatmap Data [skip ci]" || exit 0
          git push
